name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (FOSS)
        run: ./gradlew --no-daemon assembleFossDebug

      - name: Show signing key
        run: |
          APK=$(ls app/build/outputs/apk/foss/debug/*.apk | head -1)
          SIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          FP=$("$SIGNER" verify --print-certs "$APK" | grep 'SHA-256' | head -1)
          echo "::notice title=Signing key::$FP"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nfc-alarm-clock-groups-apk
          path: app/build/outputs/apk/foss/debug/*.apk

      - name: Upload database schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas/
